name: linux

on:
  push:
    branches: [main, linux-build, fexxo]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fixa o SDK 8
        run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
      - name: Build
        run: dotnet build "source/Unimake.DFe.Test/Unimake.DFe.Test.csproj" --nologo -v q
      - name: Testes multiplataforma
        run: dotnet test "source/Unimake.DFe.Test/Unimake.DFe.Test.csproj" --no-build --nologo --filter "Plataforma=Multiplataforma"

  fiscal-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fixa o SDK 8
        run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
      - name: Testes do gateway
        run: dotnet test fexxo-gateway/Fexxo.FiscalGateway.Tests/Fexxo.FiscalGateway.Tests.csproj --nologo
      - name: Imagem
        run: docker build -f fexxo-gateway/Dockerfile -t fiscal-gateway:${{ github.sha }} .
      - name: Matriz de provedores municipais (ACBr)
        env:
          TOKEN: matriz-fexxo-token-0123456789abcdef0123
        run: |
          docker run -d --name gw -e FISCAL_GATEWAY_TOKEN="$TOKEN" -e FISCAL_GATEWAY_URLS=http://0.0.0.0:8090 -p 127.0.0.1:8090:8090 fiscal-gateway:${{ github.sha }}
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/healthz >/dev/null && break; sleep 1; done
          GATEWAY=http://127.0.0.1:8090 bash fexxo-gateway/acbr/matrix/run.sh
